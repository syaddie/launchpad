<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Launchpad</title>
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- use-credentials: behind Cloudflare Access the manifest needs the sign-in cookie like everything else. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#f1efeb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1d1c1a" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Launchpad" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@200..700&family=Geist+Mono:wght@400&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400..700&family=Archivo:wght@400..900&family=Atkinson+Hyperlegible+Next:wght@400..700&family=Atkinson+Hyperlegible+Mono:wght@500&family=Doto:wght@800&display=swap"
    />
    <script>
      // Apply the saved theme before first paint so a new tab never flashes the wrong colours.
      (function () {
        var p = {};
        try { p = JSON.parse(localStorage.getItem('launchpad:prefs') || '{}'); } catch (e) {}
        var t = p.theme || 'system';
        // This browser's own layout (Settings › Layout › On this device) wins over the saved one.
        var d = 'mission';
        try { d = localStorage.getItem('launchpad:design') || p.design || d; } catch (e) {}
        // A layout that's since been retired shows the default (shared/types.ts, DESIGN_KEYS).
        if (['mission', 'vista', 'focus', 'poster'].indexOf(d) < 0) d = 'mission';
        // Follow the sun: dark from sunset to sunrise, in minutes of Singapore's day as the app last saved them (they move a
        // minute or so a day), or about 19:10 and 07:00. Only for this first paint; the app then uses the day's own times
        // (web/src/theme.ts). A theme this page doesn't know follows the device.
        if (['system', 'light', 'dark', 'sun'].indexOf(t) < 0) t = 'system';
        var sun = p.sun && p.sun.length === 2 ? p.sun : [420, 1150];
        var sg = (Date.now() / 60000 + 480) % 1440;
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches) || (t === 'sun' && (sg < sun[0] || sg >= sun[1]));
        document.documentElement.dataset.mode = dark ? 'dark' : 'light';
        document.documentElement.dataset.accent = p.accent || 'sage';
        document.documentElement.dataset.design = d;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
